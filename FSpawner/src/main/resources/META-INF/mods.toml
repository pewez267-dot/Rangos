modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/pewez267-dot/Rangos/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# Forge is required
[[dependencies.${mod_id}]]
    modId="forge"
    type="required"
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# Minecraft is required
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Infernal Mobs is an OPTIONAL integration. FSpawner works with or without it.
[[dependencies.${mod_id}]]
    modId="infernalmobs"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
