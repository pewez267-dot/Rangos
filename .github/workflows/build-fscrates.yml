name: Build FSCrates

on:
  push:
    branches:
      - "**"
    paths:
      - "FSCrates/**"
      - ".github/workflows/build-fscrates.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build mod
        working-directory: FSCrates
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon build 2>&1 | tee /tmp/build.log
          echo "${PIPESTATUS[0]}" > /tmp/build.exit
          exit 0

      - name: Determine result
        if: always()
        run: |
          EXIT=$(cat /tmp/build.exit 2>/dev/null || echo unknown)
          echo "BUILD_EXIT=${EXIT}" >> $GITHUB_ENV
          if [ "${EXIT}" = "0" ]; then echo "BUILD_OK=true" >> $GITHUB_ENV; else echo "BUILD_OK=false" >> $GITHUB_ENV; fi

      - name: Upload jar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fscrates-jar
          path: FSCrates/build/libs/*.jar
          if-no-files-found: ignore

      - name: Publish/Update release with jar
        if: env.BUILD_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fscrates-latest
          name: FSCrates (ultima compilacion)
          body: |
            Compilacion automatica de FSCrates para Forge 1.20.1.
            Descarga `fscrates-1.0.0.jar` y ponlo en tu carpeta `mods` (Forge 47.x, MC 1.20.1).
          files: FSCrates/build/libs/fscrates-1.0.0.jar
          fail_on_unmatched_files: false

      - name: Report result via issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_INFO="$(gh release view fscrates-latest --repo "${GITHUB_REPOSITORY}" --json tagName,url,assets 2>&1 || echo 'release view failed')"
          {
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_NUMBER}  exit=${BUILD_EXIT}  BUILD_OK=${BUILD_OK}"
            echo ""
            echo "Release asset URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/fscrates-latest/fscrates-1.0.0.jar"
            echo ""
            echo '```'
            echo "----- gh release view -----"
            echo "${RELEASE_INFO}"
            echo "----- build/libs -----"
            ls -la FSCrates/build/libs 2>&1 || echo "(no libs)"
            echo "----- last 60 lines of gradle log -----"
            tail -n 60 /tmp/build.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "CI build #${GITHUB_RUN_NUMBER} exit=${BUILD_EXIT} (release check)" \
            --body-file /tmp/body.md || true
