buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

version = '1.0.0'
group = 'com.fantasticshortcuts'
archivesBaseName = 'fantasticshortcuts'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.enabledGameTestNamespaces', 'fantasticshortcuts'
            mods {
                fantasticshortcuts {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.enabledGameTestNamespaces', 'fantasticshortcuts'
            mods {
                fantasticshortcuts {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'fantasticshortcuts.refmap.json'
    config 'fantasticshortcuts.mixins.json'
}

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Mixin annotation processor (Forge ships the Mixin runtime; we only need the AP for compilation).
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // LuckPerms is integrated OPTIONALLY at runtime via reflection (see integration/luckperms),
    // so it is intentionally NOT a compile dependency. The mod works with or without LuckPerms.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'fantasticshortcuts',
            'Specification-Vendor'    : 'Pewez',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'Fantastic Shortcuts',
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'Pewez',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'fantasticshortcuts.mixins.json'
        ])
    }
}

tasks.named('jar') { finalizedBy 'reobfJar' }
