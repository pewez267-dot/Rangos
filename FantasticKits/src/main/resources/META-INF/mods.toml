modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Created and owned by Pewez777. All Rights Reserved."
description='''
${mod_description}

Copyright (c) 2026 Pewez777. All Rights Reserved. Proprietary software:
copying, redistribution, reverse engineering, modpack inclusion and AI training
are prohibited without the prior written permission of Pewez777.
'''

# Forge is a mandatory dependency.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# Minecraft is a mandatory dependency.
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# LuckPerms is an OPTIONAL soft-dependency. The mod must load and run fully
# without it; only rank-aware features are disabled when it is absent.
[[dependencies.${mod_id}]]
    modId="luckperms"
    mandatory=false
    ordering="AFTER"
    side="SERVER"
