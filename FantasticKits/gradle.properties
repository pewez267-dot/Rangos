org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.2.0
# The Forge version range can use any version of Forge as bounds.
forge_version_range=[47,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings.
mapping_channel=official
# The mapping version to query from the mapping channel.
mapping_version=1.20.1

## Mod Properties

# A unique mod identifier for the mod.
mod_id=fantastickits
# The human-readable display name for the mod.
mod_name=Fantastic Kits
# The license of the mod.
mod_license=All Rights Reserved
# The mod version (semantic versioning).
mod_version=1.0.0
# The group ID for the mod.
mod_group_id=com.pewez777.fantastickits
# The authors of the mod.
mod_authors=Pewez777
# The description of the mod.
mod_description=Fantastic Kits - premium rank kit management with deep LuckPerms integration. Strict primary-group claiming, single permanent claim, visual NBT editor and per-kit command gating. Proprietary software owned by Pewez777.
