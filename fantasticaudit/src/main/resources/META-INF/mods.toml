modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: enables capturing block breaks from area tools (e.g. JustHammers) that route through
# Architectury's event. The mod runs fine without it.
[[dependencies.${mod_id}]]
    modId="architectury"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
