plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.3)'
}

version = '7.6.5'
group = 'com.claimblocks'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    // El resto del mod (Claim, ClaimManager, GlobalFlags, ...) se resuelve
    // desde el jar original SIN EntityProtectionEvents.class.
    compileOnly files("${rootDir}/libs/claimblocks-deps.jar")
}
