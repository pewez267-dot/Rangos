<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tierras Fantásticas — Wiki Oficial</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --mc-green: #5aab00;
    --mc-blue: #1a6bb5;
    --mc-gold: #f5c542;
    --mc-white: #e8e8e8;
    --mc-gray: #7a7a7a;
    --mc-dark: #0d1b2a;
    --mc-panel: rgba(10,20,40,0.88);
    --mc-border: #2a5080;
    --mc-accent: #00cfff;
    --font-title: 'Press Start 2P', monospace;
    --font-body: 'Nunito', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--mc-dark);
    color: var(--mc-white);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }
  #starfield { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none }
  .page-wrapper { position: relative; z-index: 2; }
  header{ text-align:center; padding:50px 20px 20px; position:relative }
  .header-glow{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:800px; height:400px; background: radial-gradient(ellipse, rgba(0,207,255,0.18) 0%, transparent 70%); pointer-events:none }
  .logo-img-wrap{ display:inline-block; position:relative; margin-bottom:24px }
  .title-sub{ font-family:var(--font-title); font-size:clamp(7px,1.4vw,11px); color:var(--mc-accent); letter-spacing:5px; text-shadow:0 0 12px var(--mc-accent); display:block; margin-bottom:10px }
  .version-badge{ display:inline-block; background: linear-gradient(135deg,#1a3a5c,#0a1e3a); border:2px solid var(--mc-accent); color:var(--mc-accent); font-family:var(--font-title); font-size:8px; padding:6px 18px; text-shadow:0 0 8px var(--mc-accent); box-shadow:0 0 20px rgba(0,207,255,0.25), inset 0 0 15px rgba(0,207,255,0.05); clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%); margin-top:4px }
  .search-section{ max-width:620px; margin:28px auto 0; padding:0 20px }
  .search-box{ display:flex; align-items:center; background:rgba(10,20,40,0.92); border:2px solid var(--mc-border); padding:11px 18px; gap:12px; transition:border-color .3s, box-shadow .3s }
  .search-icon{ font-size:14px; color:var(--mc-gray) }
  .search-box input{ flex:1; background:transparent; border:none; outline:none; font-family:var(--font-body); font-size:14px; font-weight:600; color:var(--mc-white); caret-color:var(--mc-accent) }
  .main-content{ max-width:1180px; margin:36px auto 80px; padding:0 20px }
  .mods-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px }
  .mod-card{ background:var(--mc-panel); border:2px solid var(--mc-border); cursor:default; transition:all .28s ease; position:relative; overflow:hidden; padding-bottom:10px }
  .card-header{ padding:16px 20px 14px; background:rgba(0,0,0,0.25); border-bottom:1px solid rgba(42,80,128,0.45); display:flex; align-items:flex-start; gap:14px }
  .mod-name{ font-family:var(--font-body); font-size:18px; font-weight:800; color:#fff; text-shadow:1px 1px 0 #000; margin-bottom:8px }
  .mod-desc{ font-family:var(--font-body); font-size:14px; font-weight:400; color:#c8dff0; line-height:1.75; margin:10px 20px }
  .mod-tag{ font-family:var(--font-body); font-size:10px; font-weight:700; padding:2px 9px; border:1px solid; text-transform:uppercase }
  .tag-utility{ color:#ff8a40; border-color:#ff8a40; background:rgba(255,138,64,0.08) }
  .pixel-divider{ height:3px; background:repeating-linear-gradient(90deg,var(--mc-border) 0px,var(--mc-border) 8px,transparent 8px,transparent 16px); margin:0 0 32px; opacity:0.35 }
  .results-bar{ font-family:var(--font-body); font-size:11px; font-weight:700; color:var(--mc-gray); margin-bottom:22px; letter-spacing:1.5px; text-transform:uppercase }
  .results-bar span{ color:var(--mc-accent) }
  footer{ text-align:center; padding:36px 20px 28px; border-top:2px solid var(--mc-border); font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--mc-gray) }
  @media(max-width:600px){ .mods-grid{ grid-template-columns:1fr } }
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="page-wrapper">
<header>
  <div class="header-glow"></div>
  <div class="logo-img-wrap"></div>
  <span class="title-sub">WIKI OFICIAL DE MODS</span>
  <div class="version-badge">JAVA EDITION 1.21.1</div>
</header>

<div class="search-section">
  <div class="search-box">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Buscar mod, ítem, descripción...">
  </div>
</div>

<main class="main-content">
  <div class="results-bar" id="resultsBar">Mostrando <span id="visibleCount">0</span> mods</div>
  <div class="pixel-divider"></div>
  <div class="mods-grid" id="modsGrid"></div>
</main>

<footer>
  <span class="footer-logo">Tierras Fantásticas</span>
  <div>Wiki generada automáticamente. Pide descripciones o enlaces por mod si lo deseas.</div>

function createCard(name){
  const card = document.createElement('div');
  card.className = 'mod-card';
  card.setAttribute('data-mod', name);
  card.innerHTML = `
    <div class="card-header">
      <div class="card-header-text">
        <div class="mod-name">${name}</div>
        <div class="mod-tags"><span class="mod-tag tag-utility">MOD</span></div>
      </div>
    </div>
    <div class="card-body"><p class="mod-desc">Descripción no disponible. Pide que añada más información o enlaces de descarga para este mod.</p></div>
  `;
  return card;
}

function buildGrid(){
  const grid = document.getElementById('modsGrid');
  mods.forEach(m => grid.appendChild(createCard(m)));
  document.getElementById('visibleCount').textContent = mods.length;
}

function setupSearch(){
  const input = document.getElementById('searchInput');
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    const cards = document.querySelectorAll('.mod-card');
    let visible = 0;
    cards.forEach(c=>{
      const name = c.getAttribute('data-mod').toLowerCase();
      if(!q || name.includes(q)){
        c.style.display = '';
        visible++;
      } else c.style.display = 'none';
    });
    document.getElementById('visibleCount').textContent = visible;
  });
}

window.addEventListener('DOMContentLoaded', ()=>{ buildGrid(); setupSearch(); });
