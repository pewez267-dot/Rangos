modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# FantasticCoins (Athens Coins) provides the official server currency. Soft dependency:
# FShop works without it (falls back to a virtual balance) but is designed to use it.
[[dependencies.${mod_id}]]
    modId="athens_coins"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
